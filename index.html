<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keeper eligibility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#EDF1EB; --surface:#FBFCFA; --ink:#13201A; --muted:#5B6A61; --line:#CCD6CE;
  --turf:#1E6A44; --turf-ink:#FFFFFF; --stamp:#1E6A44; --gold:#B9820F; --gold-bg:#F6E7C2;
  --red:#B23A26; --red-bg:#F5DCD5; --box:#E3EAE4;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1611; --surface:#16211A; --ink:#E6EEE8; --muted:#97A79C; --line:#2A3A30;
    --turf:#3FA570; --turf-ink:#06140C; --stamp:#5CC28C; --gold:#E9B949; --gold-bg:#3A2E10;
    --red:#EE7A63; --red-bg:#3D1C15; --box:#203027; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --ink:#E6EEE8; --muted:#97A79C; --line:#2A3A30;
  --turf:#3FA570; --turf-ink:#06140C; --stamp:#5CC28C; --gold:#E9B949; --gold-bg:#3A2E10;
  --red:#EE7A63; --red-bg:#3D1C15; --box:#203027; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px 120px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,4rem);line-height:.92;margin:0;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--muted);font-size:1rem}
.sub strong{color:var(--ink);font-weight:600}
.rule{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:600;font-size:1.05rem}
.rule .big{font-size:2.6rem;font-weight:800;line-height:1;color:var(--turf)}

.tools{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-width:0}
.tools input{flex:1 1 220px}
.tools select{flex:0 1 auto}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.btn.small{padding:3px 8px;font-size:.82rem}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--red)}

.rules{margin:16px 0 4px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--turf);border-radius:6px;padding:10px 14px}
.rules summary{font-family:var(--display);font-weight:700;font-size:1.2rem;cursor:pointer}
.rules ul{margin:6px 0 2px;padding-left:20px;font-size:.92rem;line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:.9rem;margin:6px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}

section.team{margin-top:20px}
.team h2{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0 0 4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 0}
.team h2 small{font-family:var(--body);font-weight:500;font-size:.9rem;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:5px 2px;border-bottom:1px solid var(--line)}
.row.editing{grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr) auto}
@media (min-width:900px){
  .row{grid-template-columns:440px 110px minmax(0,1fr)}
  .row.editing{grid-template-columns:440px 110px minmax(0,1fr) auto}
  .row .who{white-space:nowrap}
  .row .status{margin-left:12px}
}
.pname{font-weight:600;font-size:.98rem;overflow-wrap:anywhere;background:none;border:0;padding:0;color:inherit;font-family:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pname:hover{text-decoration-color:var(--turf)}
.nfl{display:inline-block;margin-left:7px;font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.02em;color:var(--muted)}
.pathwrap{padding:22px}
.path{list-style:none;margin:14px 0 6px;padding:0 0 0 14px;border-left:3px solid var(--turf)}
.path li{position:relative;padding:0 0 12px 10px}
.path li::before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--turf)}
.path .pd{display:block;font-size:.8rem;color:var(--muted)}
.path .pt{display:block;font-weight:600}
.trlink{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.trlink .trmore{display:inline-block;margin-left:6px;font-size:.8rem;font-weight:600;color:var(--turf);text-decoration:underline;text-underline-offset:2px}
.trgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 6px}
.trside{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.trside h4{margin:0 0 6px;font-family:var(--display);font-size:1.15rem}
.trside ul{margin:0;padding-left:18px;font-weight:600}
.trfrom{margin:6px 0 0;font-size:.82rem;color:var(--muted)}
.trpos{font-weight:500;font-size:.82rem;color:var(--muted);white-space:nowrap}
.trnote{margin:4px 0 0;font-size:.8rem;color:var(--muted)}
.fdnav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 0;font-size:.9rem;color:var(--muted)}
.fdnav span{font-weight:600;margin-right:2px}
.fdbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--turf);cursor:pointer}
.fdbtn:hover{border-color:var(--turf)}
dialog.fdlg{width:min(620px,96vw)}
.fdr{margin:16px 0 4px;font-family:var(--display);font-size:1.1rem}
.dlist .fdm{font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
dialog{max-height:88vh}
.dlist{list-style:none;margin:12px 0 6px;padding:0;border-top:1px solid var(--line)}
.dlist li{display:flex;align-items:baseline;gap:10px;padding:6px 8px;border-bottom:1px solid var(--line)}
.dlist .dpk{font-family:var(--display);font-weight:700;color:var(--muted);min-width:3em}
.dlist .dn{flex:1;font-weight:600}
.dlink{background:none;border:0;padding:0;font:inherit;font-weight:600;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.dlink:hover{text-decoration-color:var(--turf)}
.dlist .dk{font-size:.72rem;font-weight:700;color:var(--turf);background:var(--box);border-radius:999px;padding:1px 8px}
.dlist li.hi{background:var(--gold-bg);border-radius:6px}
.dlist li.hi .dpk,.dlist li.hi .dn{color:var(--ink)}
@media (max-width:420px){.trgrid{grid-template-columns:1fr}}
.pos{display:inline-block;font-family:var(--display);font-weight:700;font-size:.85rem;min-width:2.4em;text-align:center;padding:1px 6px;border-radius:4px;background:var(--box);color:var(--muted);margin-right:8px;vertical-align:1px}
.cost{display:inline;font-size:.82rem;color:var(--muted);margin-left:8px}
.check{display:flex;gap:8px;align-items:center;margin:-4px 0 14px;font-size:.92rem}
.cost b{font-family:var(--display);font-weight:700;font-size:.92rem;color:var(--gold)}

.box .future{color:var(--muted);opacity:.75;font-weight:600}
.boxes{display:flex;gap:4px;min-width:110px}
.box{width:34px;height:26px;border-radius:4px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.95rem;border:2px dashed var(--line);color:transparent}
.box.used{border:2px solid var(--stamp);background:var(--stamp);color:var(--turf-ink);transform:rotate(-2deg)}
.box.used:nth-child(even){transform:rotate(1.5deg)}
.box.over{border-color:var(--red);background:var(--red);color:#fff}
.box.just{animation:stamp .35s ease-out}
@keyframes stamp{0%{transform:scale(1.5) rotate(-8deg);opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.box.just{animation:none}}

.status{justify-self:start;font-weight:600;font-size:.82rem;padding:2px 9px;border-radius:999px;background:var(--box);white-space:nowrap}
.status.ok{color:var(--turf)}
.status.last{background:var(--gold-bg);color:var(--gold)}
.status.done{background:var(--red-bg);color:var(--red)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

.empty{margin-top:40px;padding:28px;border:2px dashed var(--line);border-radius:8px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:1.5rem;margin-bottom:4px}

.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;z-index:20}
.savebar[hidden]{display:none}
.savebar .btn{border-color:transparent}
.savebar .btn.quiet{color:var(--bg)}
.note{font-size:.9rem;color:var(--muted);margin-top:30px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;border-radius:6px;z-index:30;max-width:90vw}

dialog{border:none;border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(460px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,15,10,.55)}
dialog form{padding:22px}
dialog h3{font-family:var(--display);font-size:1.7rem;margin:0 0 14px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:600;font-size:.92rem;margin-bottom:5px}
.field em{display:block;font-style:normal;color:var(--muted);font-size:.85rem;margin-top:4px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.field textarea{min-height:150px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.err{color:var(--red);font-size:.9rem;min-height:1.2em;margin:0 0 6px}

@media (max-width:640px){
  .wrap{padding:18px 14px 100px}
  h1{font-size:2.1rem;line-height:.98}
  .sub{font-size:.92rem}
  .sub .upd{display:block;font-size:.85rem}
  .sub .upd .sep{display:none}
  header.top{padding-bottom:10px;border-bottom-width:2px}
  .rules{margin-top:12px;padding:8px 12px}
  .rules summary{font-size:1.1rem}
  .rules ul{font-size:.88rem}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
  .tools input{grid-column:1 / -1;font-size:16px}
  .tools select{width:100%;font-size:15px}
  .legend{font-size:.82rem;gap:12px}
  section.team{margin-top:18px}
  .team h2{display:block;font-size:1.45rem;line-height:1.15;margin-bottom:6px}
  .team h2 .meta{display:block;font-family:var(--body);font-weight:500;font-size:.82rem;color:var(--muted);margin-top:2px}
  .team h2 .meta .sep{display:none}
  .row{padding:9px 2px}
  .pname{font-size:1.02rem}
  .cost{display:block;margin:3px 0 0;font-size:.82rem;line-height:1.35}
  .status{font-size:.78rem}
  .row,.row.editing{grid-template-columns:1fr auto;grid-template-areas:"name name" "boxes status" "acts acts";gap:6px 10px}
  .row .who{grid-area:name}.row .boxes{grid-area:boxes}.row .status{grid-area:status;justify-self:end}.row .acts{grid-area:acts;justify-content:flex-start}
  .box{width:34px;height:26px}
  .boxes{min-width:110px}
}
@media (max-width:640px){
  .row,.row.editing{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name boxes" "name status" "acts acts";gap:3px 10px;padding:7px 2px;align-items:start}
  .row .boxes{justify-self:end;min-width:0;gap:3px}
  .row .box{width:24px;height:20px;font-size:.72rem;border-width:1.5px;border-radius:3px}
  .row .status{justify-self:end;max-width:118px;white-space:normal;text-align:center;line-height:1.15;font-size:.7rem;padding:2px 7px}
  .pname{font-size:.95rem}
  .pos{font-size:.7rem;padding:0 4px;margin-right:5px;min-width:2.2em}
  .nfl{font-size:.74rem;margin-left:5px}
  .cost{display:block;margin:2px 0 0;font-size:.76rem;line-height:1.3}
  .cost b{font-size:.82rem}
  .team h2{font-size:1.3rem}
}
</style>
</head>

    if (p.round === 1) return {cls:"done", text:"Ineligible - 1st Rd", left:0};
    if (left > 1) return {cls:"ok", text:left+" years left", left:left};
    if (left === 1) return {cls:"last", text:"1 year left", left:1};
    return {cls:"done", text:"Ineligible - 3rd Yr", left:0};
  }

  function teamList(){
    var t = state.teams.slice();
    state.players.forEach(function(p){ if (p.team && t.indexOf(p.team) < 0) t.push(p.team); });
    t.sort(function(a,b){ return a.localeCompare(b); });
    if (state.players.some(function(p){ return !p.team; })) t.push("");
    return t;
  }

  function render(){
    var teams = teamList();
    var q = view.q.trim().toLowerCase();
    var html = '';
    html += '<header class="top"><div><h1>'+esc(state.league)+'</h1>'
         +  '<p class="sub">Keeper eligibility for the <strong>'+esc(state.season+1)+'</strong> season'+(state.updated?'<span class="upd"><span class="sep"> - </span>Last updated '+esc(state.updated)+'</span>':'')+'</p></div>'
         +  '</header>';
    if (state.drafts) html += '<nav class="fdnav"><span>Full drafts</span>'+Object.keys(state.drafts).sort().map(function(y){ return '<button type="button" class="fdbtn" data-fd="'+esc(y)+'">'+esc(y)+'</button>'; }).join('')+'</nav>';

    var wide = true; try{ wide = window.matchMedia("(min-width:641px)").matches; }catch(e){}
    html += '<details class="rules"><summary>Keeper rules</summary><ul>'
         +  '<li>2 players can be kept each year.</li>'
         +  '<li>3-year max to keep a player, including the first year.</li>'
         +  '<li>If you add a player mid-season, it’s his ADP minus one round.</li>'
         +  '<li>If you trade for a player mid-season, it’s whatever round he was drafted in by the original owner.</li>'
         +  '<li>You can’t keep 1st rounders.</li>'
         +  '<li>You can’t keep two players at the same position.</li>'
         +  '<li>A player’s eligibility doesn’t reset when he’s traded.</li>'
         +  '</ul></details>';

    html += '<div class="tools"><input id="q" type="search" placeholder="Find a player" value="'+esc(view.q)+'" aria-label="Find a player">'
         +  '<select id="tf" aria-label="Team"><option value="all">All teams</option>'
         +  teams.map(function(t){ return '<option value="'+esc(t)+'"'+(view.team===t?' selected':'')+'>'+esc(t||"Free agents")+'</option>'; }).join('')
         +  '</select><select id="sf" aria-label="Eligibility">'
         +  [["all","Any eligibility"],["ok","2+ years left"],["last","1 year left"],["done","Returns to pool"]].map(function(o){return '<option value="'+o[0]+'"'+(view.status===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')
         +  '</select>';
    
    html += '</div>';

    html += '<div class="legend"><span><span class="box used" style="width:22px;height:18px;font-size:.7rem"></span> season counted</span>'
         +  '<span><span class="box" style="width:22px;height:18px"></span> year still available</span></div>';

    var any = false;
    teams.forEach(function(t){
      if (view.team !== "all" && view.team !== t) return;
      var ps = state.players.filter(function(p){
        if ((p.team||"") !== t) return false;
        if (q && p.name.toLowerCase().indexOf(q) < 0) return false;
        if (view.status !== "all" && info(p).cls !== view.status) return false;
        return true;
      }).sort(function(a,b){ return (a.round||99) - (b.round||99) || a.name.localeCompare(b.name); });
      if (!ps.length && (q || view.status !== "all" || !canEdit)) return;
      any = true;
      html += '<section class="team"><h2><span class="mgr">'+esc(t||"Free agents")+'</span>'+(state.info&&state.info[t]?'<span class="meta"><span class="sep">&nbsp;- </span>@'+esc(state.info[t].h)+' - '+esc(state.info[t].n)+'</span>':'')+'</h2><ul class="rows">';
      if (!ps.length) html += '<li class="row"><span class="sub">No keepers yet.</span></li>';
      ps.forEach(function(p){
        var i = info(p);
        var boxes = '';
        var n = p.round === 1 ? p.kept.length : Math.max(state.maxYears, p.kept.length);
        for (var k=0;k<n;k++){
          var y = p.kept[k];
          var cls = 'box' + (y!=null ? ' used' : '') + (k >= state.maxYears ? ' over' : '') + (justStamped===p.id && k===p.kept.length-1 ? ' just' : '');
          boxes += '<span class="'+cls+'"'+(y!=null?' title="Counted for '+esc(y)+'"':'')+'>'+(y!=null?short(y):'<span class="future">'+short((p.kept.length?p.kept[p.kept.length-1]:state.season-1)+(k-p.kept.length+1))+'</span>')+'</span>';
        }
        html += '<li class="row'+(canEdit?' editing':'')+'"><div class="who"><span class="pos">'+esc(p.pos)+'</span><button type="button" class="pname" data-path="'+esc(p.id)+'">'+esc(p.name)+'</button>'+(p.nfl?'<span class="nfl">'+esc(p.nfl)+'</span>':'')+(i.left>0 && p.round!==1 ? (p.round ? '<span class="cost"><b>'+ord(p.round)+' round pick</b> in '+esc(state.season+1)+'</span>' : (p.adp ? '<span class="cost"><b>'+esc(state.season+1)+' ADP minus one round</b></span>' : '')) : '<span class="cost">Can’t be kept in '+esc(state.season+1)+'</span>')+'</div>'
             +  '<div class="boxes" aria-label="'+p.kept.length+' of '+state.maxYears+' seasons used">'+boxes+'</div>'
             +  '<span class="status '+i.cls+'">'+i.text+'</span>';
        if (canEdit){
          var keptNow = p.kept.indexOf(state.season) >= 0;
          html += '<div class="acts">'
               +  (!keptNow && i.left>0 ? '<button class="btn small primary" data-act="keep" data-id="'+p.id+'">Keep for '+esc(state.season)+'</button>' : '')
               
               +  '</div>';
        }
        html += '</li>';
      });
      html += '</ul></section>';
    });

    if (!any){
      if (!state.players.length && !state.teams.length)
        html += canEdit
          ? '<div class="empty"><strong>Set up your league</strong>Add your league’s team names in League settings, then add each keeper and the seasons they’ve been kept.</div>'
          : '<div class="empty"><strong>No keepers posted yet</strong>The commissioner hasn’t added any players.</div>';
      else html += '<div class="empty"><strong>No matching players</strong>Try a different name, team or eligibility filter.</div>';
    }

    html += '<p class="note">A player’s first season on a team fills the first box, and each season they’re kept fills another. When every box is filled, the player goes back into the draft pool.'
         + (canEdit ? '' : ' Only the commissioner can make changes.') + '</p>';

    root.innerHTML = html;
    justStamped = null;
    bind();
    renderBar();
  }

  function renderBar(){
    var bar = document.getElementById("savebar");
    if (!bar){ bar = document.createElement("div"); bar.id="savebar"; bar.className="savebar"; document.body.appendChild(bar); }
    bar.hidden = !(canEdit && dirty);
    bar.innerHTML = '<span>'+dirty+' unpublished change'+(dirty===1?'':'s')+'</span>'
      + '<button class="btn quiet" id="discard">Discard</button><button class="btn primary" id="publish">Publish to league</button>';
    document.getElementById("discard").onclick = function(){
      state = JSON.parse(JSON.stringify(SAVED)); dirty = 0;
      try{ sessionStorage.removeItem(STASH); }catch(e){}
      render();
    };
    document.getElementById("publish").onclick = publish;
  }

  function bind(){
    var q = document.getElementById("q");
    q.oninput = function(){ view.q = q.value; var pos = q.selectionStart; render(); var n=document.getElementById("q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} };
    document.getElementById("tf").onchange = function(e){ view.team = e.target.value; render(); };
    document.getElementById("sf").onchange = function(e){ view.status = e.target.value; render(); };
    var add = document.getElementById("add"); if (add) add.onclick = function(){ openPlayer(null); };
    var st = document.getElementById("settings"); if (st) st.onclick = openSettings;
    root.querySelectorAll("[data-fd]").forEach(function(b){ b.onclick = function(){ openFullDraft(b.dataset.fd); }; });
    root.querySelectorAll("[data-path]").forEach(function(b){
      b.onclick = function(){ var p = state.players.find(function(x){ return x.id === b.dataset.path; }); if (p) openPath(p); };
    });
    root.querySelectorAll("[data-act]").forEach(function(b){
      b.onclick = function(){
        var p = state.players.find(function(x){ return x.id === b.dataset.id; });
        if (!p) return;
        if (b.dataset.act === "keep"){ p.kept.push(state.season); p.kept.sort(); justStamped = p.id; change(); }
        else if (b.dataset.act === "unkeep"){ p.kept = p.kept.filter(function(y){ return y !== state.season; }); change(); }
        else openPlayer(p);
      };
    });
  }

  function change(){
    dirty++;
    try{ sessionStorage.setItem(STASH, JSON.stringify(state)); }catch(e){}
    render();
  }

  function parseYears(s){
    var out = [], bad = false;
    String(s).split(/[\s,]+/).filter(Boolean).forEach(function(t){
      var y = parseInt(t,10);
      if (!/^\d{4}$/.test(t) || y < 1990 || y > 2100) bad = true; else if (out.indexOf(y) < 0) out.push(y);
    });
    return bad ? null : out.sort();
  }

  function dialog(inner, onSubmit){
    var d = document.createElement("dialog");
    d.innerHTML = '<form method="dialog">'+inner+'<p class="err" id="err"></p><div class="dlg-acts" id="dacts"></div></form>';
    document.body.appendChild(d);
    d.addEventListener("close", function(){ d.remove(); });
    d.querySelector("form").addEventListener("submit", function(e){
      if (e.submitter && e.submitter.value === "cancel") return;
      var msg = onSubmit(d);
      if (msg){ e.preventDefault(); d.querySelector("#err").textContent = msg; }
    });
    d.showModal();
    return d;
  }

  function openPlayer(p){
    var teams = teamList().filter(function(t){ return t; });
    var d = dialog(
      '<h3>'+(p?'Edit player':'Add player')+'</h3>'
      + '<label class="field"><span>Player name</span><input name="pname" required value="'+esc(p?p.name:"")+'"></label>'
      + '<div class="two"><label class="field"><span>Position</span><select name="pos">'+POS.map(function(x){return '<option'+(p&&p.pos===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label>'
      + '<label class="field"><span>Team</span><select name="team">'+(teams.length?'':'<option value="">Unassigned</option>')+teams.map(function(t){return '<option value="'+esc(t)+'"'+(p&&p.team===t?' selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select></label></div>'
      + '<label class="field"><span>Seasons counted</span><input name="kept" inputmode="numeric" placeholder="e.g. 2025, 2026" value="'+esc(p?p.kept.join(", "):"")+'"><em>Include the first season they were on the team, plus each season kept.</em></label>'
      + '<label class="field"><span>Round drafted in '+esc(state.season)+'</span><input name="round" type="number" min="1" max="30" value="'+esc(p&&p.round?p.round:"")+'"><em>The round it costs to keep them next season.</em></label>'
      + '<label class="check"><input type="checkbox" name="adp"'+(p&&p.adp?' checked':'')+'> Not drafted (keep at next year’s ADP minus one round)</label>',
      function(d){
        var f = d.querySelector("form");
        var name = f.pname.value.trim();
        if (!name) return "Enter the player’s name.";
        var kept = parseYears(f.kept.value);
        if (!kept) return "Seasons counted should be four-digit years, separated by commas.";
        if (kept.length > state.maxYears) return "That’s more than the "+state.maxYears+"-season maximum.";
        var rnd = f.round.value.trim() ? parseInt(f.round.value,10) : null;
        if (rnd !== null && !(rnd >= 1 && rnd <= 30)) return "Enter the draft round as a number from 1 to 30.";
        var adp = rnd === null && f.adp.checked;
        if (p){ p.name=name; p.pos=f.pos.value; p.team=f.team.value; p.kept=kept; p.round=rnd; p.adp=adp; }
        else state.players.push({id:uid(), name:name, pos:f.pos.value, team:f.team.value, kept:kept, round:rnd, adp:adp});
        change();
      });
    var acts = d.querySelector("#dacts");
    acts.innerHTML = (p?'<button type="button" class="btn danger" id="rm" style="margin-right:auto">Release to pool</button>':'')
      + '<button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">'+(p?'Save player':'Add player')+'</button>';
    var rm = d.querySelector("#rm");
    if (rm) rm.onclick = function(){
      if (!confirm("Remove "+p.name+" from the keeper list?")) return;
      state.players = state.players.filter(function(x){ return x.id !== p.id; });
      d.close(); change();
    };
  }

  function openPath(p){
    var d = document.createElement("dialog");
    d.className = "pathdlg";
    var items = (p.path && p.path.length) ? p.path.map(function(e){ return '<li><span class="pd">'+esc(e.d)+'</span>'+(e.tr&&state.trades&&state.trades[e.tr]?'<button type="button" class="pt trlink" data-tr="'+esc(e.tr)+'">'+esc(e.t)+' <span class="trmore">See full trade</span></button>':ptxt(e))+'</li>'; }).join('') : '<li><span class="pt">No history recorded for this player yet.</span></li>';
    d.innerHTML = '<div class="pathwrap"><h3>'+esc(p.name)+'</h3><p class="sub">'+esc(p.pos)+(p.nfl?', '+esc(p.nfl):'')+(p.team?', now with '+esc(p.team):', free agent')+'</p><ol class="path">'+items+'</ol><div class="dlg-acts"><button type="button" class="btn primary">Close</button></div></div>';
    document.body.appendChild(d);
    d.addEventListener("close", function(){ d.remove(); });
    d.addEventListener("click", function(e){ if (e.target === d) d.close(); });
    d.querySelector(".btn").onclick = function(){ d.close(); };
    d.querySelectorAll("[data-tr]").forEach(function(b){ b.onclick = function(){ openTrade(b.dataset.tr); }; });
    d.querySelectorAll("[data-dr]").forEach(function(b){ b.onclick = function(){ openDraft(b.dataset.dr, b.dataset.mgr, p.name); }; });
    d.querySelectorAll(".trside, .dlist").length;
    d.showModal();
  }

  function ptxt(e){
    var m = e.dr && state.drafts && state.drafts[e.dr] ? e.t.match(/ by (\w+) (?:at|with) pick/) : null;
    if (m && state.drafts[e.dr][m[1]]) return '<button type="button" class="pt trlink" data-dr="'+esc(e.dr)+'" data-mgr="'+esc(m[1])+'">'+esc(e.t)+' <span class="trmore">See full draft</span></button>';
    return '<span class="pt">'+esc(e.t)+'</span>';
  }
  function nn(s){ return String(s).toLowerCase().replace(/[\u2019'.\-]/g,"").replace(/\b(jr|sr|ii|iii|iv)\b/g,"").replace(/\s+/g," ").trim(); }

  function dname(n){
    var q = state.players.find(function(z){ return nn(z.name) === nn(n); });
    if (q) return '<button type="button" class="dlink" data-pid="'+esc(q.id)+'">'+esc(n)+'</button>';
    var k = nn(n).replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
    if (state.others && state.others[k]) return '<button type="button" class="dlink" data-ok="'+esc(k)+'">'+esc(n)+'</button>';
    return esc(n);
  }
  function bindNames(d){
    d.querySelectorAll("[data-pid]").forEach(function(b){ b.onclick = function(){ var q = state.players.find(function(z){ return z.id === b.dataset.pid; }); if (q) openPath(q); }; });
    d.querySelectorAll("[data-ok]").forEach(function(b){ b.onclick = function(){ var o = state.others && state.others[b.dataset.ok]; if (o) openPath(o); }; });
  }

  function openDraft(year, mgr, name){
    var list = state.drafts && state.drafts[year] && state.drafts[year][mgr]; if (!list) return;
    var info = state.info && state.info[mgr];
    var rows = list.map(function(x){ var hi = nn(x.n) === nn(name); return '<li class="'+(hi?'hi':'')+'"><span class="dpk">'+esc(x.pk)+'</span><span class="dn">'+dname(x.n)+(x.p?' <span class="trpos">'+esc(x.p)+(x.t&&x.p!=='DEF'?', '+esc(x.t):'')+'</span>':'')+'</span>'+(x.k?'<span class="dk">Keeper</span>':'')+'</li>'; }).join('');
    var d = document.createElement("dialog");
    d.innerHTML = '<div class="pathwrap"><h3>'+esc(mgr)+'\u2019s '+esc(year)+' draft</h3><p class="sub">'+(state.teamNames&&state.teamNames[year]&&state.teamNames[year][mgr]?esc(state.teamNames[year][mgr])+', ':(info?esc(info.n)+', ':''))+esc(year==='2026'?'Sleeper':'Yahoo')+'</p><button type="button" class="trlink fdlink"><span class="trmore" style="margin-left:0">See the full '+esc(year)+' draft</span></button><ol class="dlist">'+rows+'</ol><p class="trnote">Positions and NFL teams as of the draft.</p><div class="dlg-acts"><button type="button" class="btn primary">Close</button></div></div>';
    document.body.appendChild(d);
    d.addEventListener("close", function(){ d.remove(); });
    d.addEventListener("click", function(e){ if (e.target === d) d.close(); });
    d.querySelector(".btn").onclick = function(){ d.close(); };
    d.showModal();
    bindNames(d);
    var fl = d.querySelector(".fdlink"); if (fl) fl.onclick = function(){ openFullDraft(year); };
    var h = d.querySelector("li.hi"); if (h && h.scrollIntoView) h.scrollIntoView({block:"center"});
  }

  function openFullDraft(year){
    var all = state.drafts && state.drafts[year]; if (!all) return;
    var picks = [];
    Object.keys(all).forEach(function(mgr){ all[mgr].forEach(function(x){ picks.push({x:x, mgr:mgr}); }); });
    picks.sort(function(a,b){ var p=a.x.pk.split("."), q=b.x.pk.split("."); return (+p[0])-(+q[0]) || (+p[1])-(+q[1]); });
    var html = '', rnd = null;
    picks.forEach(function(o){
      var r = o.x.pk.split(".")[0];
      if (r !== rnd){ if (rnd !== null) html += '</ol>'; html += '<h4 class="fdr">Round '+esc(r)+'</h4><ol class="dlist">'; rnd = r; }
      html += '<li><span class="dpk">'+esc(o.x.pk)+'</span><span class="dn">'+dname(o.x.n)+(o.x.p?' <span class="trpos">'+esc(o.x.p)+(o.x.t&&o.x.p!=="DEF"?', '+esc(o.x.t):'')+'</span>':'')+'</span>'+(o.x.k?'<span class="dk">Keeper</span>':'')+'<span class="fdm">'+esc(o.mgr)+'</span></li>';
    });
    if (rnd !== null) html += '</ol>';
    var r1 = picks.filter(function(o){ return o.x.pk.split(".")[0] === "1"; }).map(function(o){ return o.mgr; });
    var mgrs = r1.concat(Object.keys(all).filter(function(m){ return r1.indexOf(m) < 0; }));
    var thtml = mgrs.map(function(mgr){
      var tn = state.teamNames && state.teamNames[year] && state.teamNames[year][mgr] ? state.teamNames[year][mgr] : (state.info && state.info[mgr] ? state.info[mgr].n : '');
      return '<h4 class="fdr">'+esc(mgr)+(tn?' <span class="trpos">'+esc(tn)+'</span>':'')+'</h4><ol class="dlist">'+picks.filter(function(o){ return o.mgr === mgr; }).map(function(o){ return '<li><span class="dpk">'+esc(o.x.pk)+'</span><span class="dn">'+dname(o.x.n)+(o.x.p?' <span class="trpos">'+esc(o.x.p)+(o.x.t&&o.x.p!=="DEF"?', '+esc(o.x.t):'')+'</span>':'')+'</span>'+(o.x.k?'<span class="dk">Keeper</span>':'')+'</li>'; }).join('')+'</ol>';
    }).join('');
    var d = document.createElement("dialog");
    d.className = "fdlg";
    d.innerHTML = '<div class="pathwrap"><h3>'+esc(year)+' draft</h3><p class="sub">'+esc(year==='2026'?'Sleeper':'Yahoo')+', '+esc(year==='2024'?'Sep 1, 2024':year==='2025'?'Aug 20, 2025':'Aug 22, 2026')+'</p><button type="button" class="trlink fdtog"><span class="trmore" style="margin-left:0">View by team</span></button><div class="fdround">'+html+'</div><div class="fdteam" hidden>'+thtml+'</div><p class="trnote">Positions and NFL teams as of the draft.</p><div class="dlg-acts"><button type="button" class="btn primary">Close</button></div></div>';
    document.body.appendChild(d);
    d.addEventListener("close", function(){ d.remove(); });
    d.addEventListener("click", function(e){ if (e.target === d) d.close(); });
    d.querySelector(".btn").onclick = function(){ d.close(); };
    bindNames(d);
    var tg = d.querySelector(".fdtog"); tg.onclick = function(){ var a = d.querySelector(".fdround"), b = d.querySelector(".fdteam"); var toTeam = !a.hidden; a.hidden = toTeam; b.hidden = !toTeam; tg.querySelector(".trmore").textContent = toTeam ? "View by round" : "View by team"; d.querySelector(".pathwrap").scrollTop = 0; d.scrollTop = 0; };
    d.showModal();
  }

  function openTrade(id){
    var t = state.trades && state.trades[id]; if (!t) return;
    var d = document.createElement("dialog");
    var sides = t.sides.map(function(s){ return '<div class="trside"><h4>'+esc(s.to)+' received</h4><ul>'+s.players.map(function(n){ return typeof n === "string" ? '<li>'+esc(n)+'</li>' : '<li>'+dname(n.n)+' <span class="trpos">'+esc(n.p)+', '+esc(n.t)+'</span></li>'; }).join('')+'</ul><p class="trfrom">from '+esc(s.from)+'</p></div>'; }).join('');
    d.innerHTML = '<div class="pathwrap"><h3>Trade</h3><p class="sub">'+esc(t.d)+'</p><div class="trgrid">'+sides+'</div><p class="trnote">Positions and NFL teams as of the trade.</p><div class="dlg-acts"><button type="button" class="btn primary">Close</button></div></div>';
    document.body.appendChild(d);
    bindNames(d);
    d.addEventListener("close", function(){ d.remove(); });
    d.addEventListener("click", function(e){ if (e.target === d) d.close(); });
    d.querySelector(".btn").onclick = function(){ d.close(); };
    d.showModal();
  }

  function openSettings(){
    var d = dialog(
      '<h3>League settings</h3>'
      + '<label class="field"><span>League name</span><input name="league" required value="'+esc(state.league)+'"></label>'
      + '<div class="two"><label class="field"><span>Current keeper season</span><input name="season" inputmode="numeric" value="'+esc(state.season)+'"></label>'
      + '<label class="field"><span>Max seasons per keeper</span><input name="max" type="number" min="1" max="10" value="'+esc(state.maxYears)+'"></label></div>'
      + '<label class="field"><span>Teams</span><textarea name="teams" placeholder="One team per line">'+esc(state.teams.join("\n"))+'</textarea><em>Renaming a team here moves its players to Unassigned until you edit them.</em></label>',
      function(d){
        var f = d.querySelector("form");
        var season = parseInt(f.season.value,10), max = parseInt(f.max.value,10);
        if (!f.league.value.trim()) return "Enter a league name.";
        if (!(season >= 1990 && season <= 2100)) return "Enter the season as a four-digit year.";
        if (!(max >= 1 && max <= 10)) return "Max seasons should be between 1 and 10.";
        var teams = []; f.teams.value.split("\n").map(function(s){return s.trim();}).forEach(function(t){ if (t && teams.indexOf(t)<0) teams.push(t); });
        state.league = f.league.value.trim(); state.season = season; state.maxYears = max; state.teams = teams;
        state.players.forEach(function(p){ if (p.team && teams.indexOf(p.team) < 0) p.team = ""; });
        change();
      });
    d.querySelector("#dacts").innerHTML = '<button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Save settings</button>';
  }

  function buildPage(s){
    var json = JSON.stringify(s).replace(/</g,"\\u003c");
    return '<!doctype html>\n<html lang="en">\n<head>'
      + '\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Keeper eligibility</title>'
      + '\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '\n<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">'
      + '\n<style id="app-style">' + document.getElementById("app-style").textContent + '</style>\n</head>\n<body>'
      + '\n<div class="wrap" id="root"><p class="sub">Loading keepers…</p></div>'
      + '\n<script type="application/json" id="state">' + json + '<\/script>'
      + '\n<script id="app-script">' + document.getElementById("app-script").textContent + '<\/script>\n</body>\n</html>\n';
  }

  function toast(msg){
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 5000);
  }

  function publish(){
    if (!artifactApi) return;
    var btn = document.getElementById("publish"); btn.disabled = true; btn.textContent = "Publishing…";
    try{ sessionStorage.setItem(STASH, JSON.stringify(state)); }catch(e){}
    try{ state.updated = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }catch(e){}
    artifactApi.publish(buildPage(state)).then(function(){
      try{ sessionStorage.removeItem(STASH); }catch(e){}
    }).catch(function(err){
      var code = err && err.code;
      if (code === "conflict") return; // page reloads to the newer version; stash restores edits
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required" || code === "capability_disabled"){
        canEdit = false; dirty = 0; try{ sessionStorage.removeItem(STASH); }catch(e){}
        state = JSON.parse(JSON.stringify(SAVED)); render(); toast("This view is read-only, so changes can’t be published from here.");
        return;
      }
      btn.disabled = false; btn.textContent = "Publish to league";
      toast(code === "rate_limited" ? "Publishing too quickly. Wait a moment, then publish again." : "Couldn’t publish just now. Your changes are still here; try again.");
    });
  }

  render();

  if (window.claude && window.claude.use){
    Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function(r){
      artifactApi = r[0];
      var u = r[1];
      if (!artifactApi || !u) return;
      return u.canEdit().then(function(ok){
        if (!ok) return;
        canEdit = true;
        try{
          var pending = sessionStorage.getItem(STASH);
          if (pending){
            var ps = JSON.parse(pending);
            if (JSON.stringify(ps) !== JSON.stringify(SAVED)){ state = ps; dirty = 1; }
            else sessionStorage.removeItem(STASH);
          }
        }catch(e){}
        render();
      });
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
